name: Build & Deploy

on:
  push:
    branches: [ main ]

permissions:
  contents: write  # ← add this

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Terser
        run: npm install -g terser

      - name: Build (minify + obfuscate)
        run: |
          mkdir -p dist
          files=(
            "data" "sync" "auth" "pages" "autoassign"
            "attendance" "nav" "policy-compliance"
            "policy-feedback" "training.views" "report"
            "firebase-auth"
          )
          for f in "${files[@]}"; do
            terser "${f}.js" -o "dist/${f}.js" \
              --compress drop_console=true \
              --mangle \
              --mangle-props keep_quoted=strict
            echo "✓ ${f}.js → dist/${f}.js"
          done

      - name: Copy static assets
        run: |
          cp index.html dist/index.html
          cp styles.css dist/styles.css 2>/dev/null || true
          cp sync-config.json dist/sync-config.json 2>/dev/null || true
          cp -r assets dist/assets 2>/dev/null || true

      - name: Remove source maps
        run: find dist -name "*.js" -exec sed -i '/sourceMappingURL/d' {} \;

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
