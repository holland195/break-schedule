<!-- ─────────────────────────────────────────────────────
  CHANGE 3: Replace bootApp() in the inline <script> block
  at the bottom of index.html
  
  BEFORE: the old bootApp() that called syncTryAutoConnect
  
  AFTER:
───────────────────────────────────────────────────── -->

<script>
  // Modal overlay click to close
  document.querySelectorAll('.modal-overlay').forEach(el => {
    el.addEventListener('click', e => { if (e.target === el) el.classList.remove('show'); });
  });
  // Enter key on password field
  document.getElementById('li-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  // Theme labels
  function updateLoginThemeBtn() { /* removed */ }
  function updateAppThemeBtn() {
    const btn = document.getElementById('theme-toggle-btn');
    if (btn) {
      btn.textContent = currentTheme === 'dark' ? '☀' : '☾';
      btn.title       = currentTheme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
    }
  }
  updateAppThemeBtn();

  // ── Boot: Firebase Auth handles session restore ──
  // onAuthStateChanged fires on every page load.
  // If the user has a valid Firebase session token, they are
  // automatically logged in without seeing the login screen.
  async function bootApp() {
    const btn = document.getElementById('signin-btn');
    const err = document.getElementById('login-err');

    // Show loading state while Firebase checks session
    if (btn) btn.disabled = true;
    if (err) { err.style.color = 'var(--text3)'; err.textContent = '☁ Loading…'; }

    // Pull cloud config (for sync) in parallel
    try { await syncTryAutoConnect(); } catch(e) { /* offline — ok */ }

    if (btn) btn.disabled = false;
    if (err) { err.style.color = ''; err.textContent = ''; }
  }

  // ── Firebase Auth state listener ──
  // This replaces the old restoreSession() call.
  // Firebase fires this once at page load with the current auth state.
  firebaseOnAuthStateChanged(async (firebaseUser) => {
    if (firebaseUser) {
      // Firebase has a valid session → auto-login
      // Extract username from email: "cuong.pham@bsched.app" → "cuong.pham"
      const username = firebaseUser.email.replace('@bsched.app', '');
      const session  = DB.getSession();

      // Use saved session shift, or default to 'E'
      currentShift = session?.shift || 'E';

      const user = _resolveUser(username);
      if (user) {
        currentUser = user;
        // Pull latest cloud data, then enter app
        if (syncEnabled()) {
          updateSyncBadge('busy');
          await syncPull();
          updateSyncBadge('ok');
        }
        enterApp(true);
        startSyncPolling && startSyncPolling();
        return;
      }
    }
    // No valid Firebase session → show login screen normally
    bootApp();
  });
</script>
