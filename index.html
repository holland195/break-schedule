<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Break Schedule — Shift Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;
  --bg2:#161616;
  --bg3:#1e1e1e;
  --bg4:#252525;
  --bg5:#2e2e2e;
  --border:#333;
  --border2:#444;
  --text:#f0f0f0;
  --text2:#a0a0a0;
  --text3:#666;
  --accent:#e8ff47;
  --accent2:#b8cc2a;
  --ok:#4ade80;
  --err:#f87171;
  --warn:#fbbf24;
  --r:6px;
  --A-color:#ff7eb3; --A-bg:#2d1020;
  --B-color:#7dd3fc; --B-bg:#0c1f2d;
  --C-color:#86efac; --C-bg:#0c2218;
  --D-color:#fca5a5; --D-bg:#2d0f0f;
  --E-color:#c4b5fd; --E-bg:#1a1030;
}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;min-height:100vh;overflow-x:hidden}
/* ── SCREENS ── */
.screen{display:none;min-height:100vh}
.screen.active{display:block}
/* ── TOPBAR ── */
.topbar{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:300;
}
.topbar-brand{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.04em}
.topbar-right{display:flex;align-items:center;gap:12px}
.user-chip{
  display:flex;align-items:center;gap:8px;
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:99px;padding:4px 12px 4px 6px;font-size:12px;
}
.user-avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:var(--accent);color:#000}
.role-tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;font-family:'IBM Plex Mono',monospace;letter-spacing:.02em}
.role-leader{background:#2a1f0a;color:#fbbf24;border:1px solid #5a3a0a}
.role-agent{background:#0a1a2a;color:#7dd3fc;border:1px solid #0a3a5a}
.role-qa{background:#1a0a2a;color:#c4b5fd;border:1px solid #3a0a5a}
/* ── BUTTONS ── */
.btn{
  font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;
  padding:7px 16px;border-radius:var(--r);border:1px solid var(--border2);
  background:var(--bg3);color:var(--text);cursor:pointer;transition:all .12s;white-space:nowrap;
}
.btn:hover{background:var(--bg4);border-color:var(--border2)}
.btn-accent{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
.btn-accent:hover{background:var(--accent2);border-color:var(--accent2)}
.btn-ok{background:#14532d;color:var(--ok);border-color:#166534}
.btn-ok:hover{background:#166534}
.btn-err{background:#450a0a;color:var(--err);border-color:#7f1d1d}
.btn-err:hover{background:#7f1d1d}
.btn-warn{background:#422006;color:var(--warn);border-color:#854d0e}
.btn-warn:hover{background:#854d0e}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-xs{padding:3px 8px;font-size:10px}
.btn:disabled{opacity:.35;cursor:not-allowed}
/* ── LOGIN ── */
#screen-login{
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);
  background-image:repeating-linear-gradient(0deg,transparent,transparent 39px,var(--border) 39px,var(--border) 40px),
    repeating-linear-gradient(90deg,transparent,transparent 39px,var(--border) 39px,var(--border) 40px);
}
.login-card{
  background:var(--bg2);border:1px solid var(--border2);border-radius:12px;
  padding:36px 32px;width:420px;max-width:95vw;
  box-shadow:0 24px 80px rgba(0,0,0,.6);
}
.login-logo{
  font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;
  color:var(--accent);letter-spacing:.06em;margin-bottom:6px;
}
.login-sub{font-size:12px;color:var(--text2);margin-bottom:28px;font-family:'IBM Plex Mono',monospace}
.login-label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;margin-top:16px;display:block}
.login-input,.login-select{
  width:100%;font-family:'IBM Plex Sans',sans-serif;font-size:13px;
  padding:9px 12px;background:var(--bg3);border:1px solid var(--border2);
  border-radius:var(--r);color:var(--text);transition:border .12s;
}
.login-input:focus,.login-select:focus{outline:none;border-color:var(--accent)}
.login-input::placeholder{color:var(--text3)}
.login-actions{margin-top:24px;display:flex;flex-direction:column;gap:10px}
.login-divider{display:flex;align-items:center;gap:10px;margin:4px 0;color:var(--text3);font-size:11px}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.import-row{display:flex;gap:8px}
.import-row input{flex:1}
/* ── MAIN LAYOUT ── */
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 52px)}
.sidebar{background:var(--bg2);border-right:1px solid var(--border);padding:16px 0;position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto}
.sidebar-section{padding:0 12px;margin-bottom:4px}
.sidebar-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);padding:8px 12px 4px;font-family:'IBM Plex Mono',monospace}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--r);
  color:var(--text2);cursor:pointer;transition:all .1s;font-size:12px;font-weight:500;
  position:relative;
}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--bg4);color:var(--accent)}
.nav-item.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:2px;background:var(--accent);border-radius:0 2px 2px 0}
.nav-ico{font-size:14px;width:18px;text-align:center}
.nav-badge{margin-left:auto;background:var(--err);color:#fff;font-size:9px;font-weight:700;padding:2px 5px;border-radius:99px;min-width:16px;text-align:center}
.content{padding:24px;overflow-y:auto}
/* ── SHIFT SELECTOR ── */
.shift-selector{
  background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.shift-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);font-family:'IBM Plex Mono',monospace}
.shift-pills{display:flex;gap:6px;flex-wrap:wrap}
.shift-pill{
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
  padding:5px 14px;border-radius:99px;border:1px solid var(--border2);
  background:var(--bg3);color:var(--text2);cursor:pointer;transition:all .12s;
}
.shift-pill.A{border-color:var(--A-color);color:var(--A-color)}
.shift-pill.A.on{background:var(--A-bg)}
.shift-pill.B{border-color:var(--B-color);color:var(--B-color)}
.shift-pill.B.on{background:var(--B-bg)}
.shift-pill.C{border-color:var(--C-color);color:var(--C-color)}
.shift-pill.C.on{background:var(--C-bg)}
.shift-pill.D{border-color:var(--D-color);color:var(--D-color)}
.shift-pill.D.on{background:var(--D-bg)}
.shift-pill.E{border-color:var(--E-color);color:var(--E-color)}
.shift-pill.E.on{background:var(--E-bg)}
.shift-time{font-size:12px;color:var(--text2);font-family:'IBM Plex Mono',monospace;margin-left:auto}
/* ── PAGE HEADER ── */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-title{font-size:20px;font-weight:600;letter-spacing:-.02em}
.page-sub{font-size:12px;color:var(--text2);margin-top:2px}
/* ── CARDS / PANELS ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);font-family:'IBM Plex Mono',monospace;margin-bottom:14px}
/* ── STAFF TABLE ── */
.tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
thead th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);padding:9px 12px;text-align:left;background:var(--bg3);border-bottom:1px solid var(--border);white-space:nowrap;font-family:'IBM Plex Mono',monospace}
th.c,td.c{text-align:center}
tbody tr{border-bottom:1px solid var(--border);transition:background .08s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--bg3)}
td{padding:8px 12px;vertical-align:middle}
td.mono{font-family:'IBM Plex Mono',monospace;font-size:11px}
/* ── SHIFT BADGE ── */
.sh{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700}
.sh-A{background:var(--A-bg);color:var(--A-color);border:1px solid var(--A-color)}
.sh-B{background:var(--B-bg);color:var(--B-color);border:1px solid var(--B-color)}
.sh-C{background:var(--C-bg);color:var(--C-color);border:1px solid var(--C-color)}
.sh-D{background:var(--D-bg);color:var(--D-color);border:1px solid var(--D-color)}
.sh-E{background:var(--E-bg);color:var(--E-color);border:1px solid var(--E-color)}
.sh-0{background:var(--bg4);color:var(--text3);border:1px solid var(--border)}
/* ── BREAK SCHEDULE BOARD ── */
.break-board{display:grid;gap:10px}
.break-row{
  background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:12px 16px;display:grid;grid-template-columns:180px 1fr auto;align-items:center;gap:16px;
  transition:border-color .12s;
}
.break-row:hover{border-color:var(--border2)}
.break-row.pending{border-color:var(--warn)}
.emp-name{font-weight:600;font-size:13px}
.emp-meta{font-size:11px;color:var(--text2);font-family:'IBM Plex Mono',monospace}
.break-slots{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.break-slot{
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;
  padding:4px 10px;border-radius:5px;border:1px solid var(--border2);
  background:var(--bg3);color:var(--text2);cursor:pointer;transition:all .12s;
}
.break-slot:hover{border-color:var(--accent);color:var(--accent)}
.break-slot.assigned{background:#1a2a0a;color:#86efac;border-color:#4ade80}
.break-slot.mine{background:#1a1f0a;color:var(--accent);border-color:var(--accent);font-weight:600}
.break-slot.locked{cursor:default;opacity:.7}
.break-slot.locked:hover{border-color:var(--border2);color:var(--text2)}
.time-label{font-size:10px;color:var(--text3);font-family:'IBM Plex Mono',monospace;white-space:nowrap}
/* ── WEEK GRID ── */
.week-grid{display:grid;grid-template-columns:180px repeat(7,1fr);gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.wg-header{background:var(--bg3);padding:8px 10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);font-family:'IBM Plex Mono',monospace;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
.wg-header:last-child{border-right:none}
.wg-name{background:var(--bg2);padding:9px 12px;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
.wg-name .n{font-weight:600;font-size:12px}
.wg-name .m{font-size:10px;color:var(--text2);font-family:'IBM Plex Mono',monospace}
.wg-cell{background:var(--bg2);padding:6px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.wg-cell:last-child{border-right:none}
.wg-row:last-child .wg-cell,.wg-row:last-child .wg-name{border-bottom:none}
.slot-select{
  font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
  padding:3px 6px;border-radius:4px;border:1px solid var(--border2);
  background:var(--bg3);color:var(--text);cursor:pointer;
  appearance:none;-webkit-appearance:none;text-align:center;width:52px;
}
.slot-select.v-D1{background:#0c1f0a;color:#4ade80;border-color:#4ade80}
.slot-select.v-D2{background:#0a1d2d;color:#7dd3fc;border-color:#7dd3fc}
.slot-select.v-OFF{background:var(--bg4);color:var(--text3);border-color:var(--border2)}
/* ── REQUEST CARDS ── */
.req-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:14px 16px;margin-bottom:10px;
}
.req-card.pending{border-color:var(--warn)}
.req-card.approved{border-color:var(--ok)}
.req-card.rejected{border-color:var(--err)}
.req-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.req-title{font-weight:600;font-size:13px}
.req-meta{font-size:11px;color:var(--text2);margin-top:2px;font-family:'IBM Plex Mono',monospace}
.req-status{font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;font-family:'IBM Plex Mono',monospace;white-space:nowrap}
.req-status.pending{background:#2a1a00;color:var(--warn);border:1px solid #854d0e}
.req-status.approved{background:#0a2a0a;color:var(--ok);border:1px solid #166534}
.req-status.rejected{background:#2a0a0a;color:var(--err);border:1px solid #7f1d1d}
.req-body{font-size:12px;color:var(--text2);margin-bottom:12px;line-height:1.6}
.req-actions{display:flex;gap:8px}
/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.stat-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);font-family:'IBM Plex Mono',monospace;margin-bottom:6px}
.stat-num{font-size:26px;font-weight:600;letter-spacing:-.03em;font-family:'IBM Plex Mono',monospace}
/* ── FORM ── */
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fg label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);font-family:'IBM Plex Mono',monospace}
.fg input,.fg select,.fg textarea{
  font-family:'IBM Plex Sans',sans-serif;font-size:13px;
  padding:8px 10px;background:var(--bg3);border:1px solid var(--border2);
  border-radius:var(--r);color:var(--text);transition:border .12s;
}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--accent)}
.fg textarea{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
/* ── TABS ── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{padding:8px 16px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .1s;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab-panel{display:none}
.tab-panel.on{display:block}
/* ── MISC ── */
.divider{height:1px;background:var(--border);margin:16px 0}
.empty{text-align:center;padding:36px;color:var(--text3);font-size:12px}
.empty-ico{font-size:28px;margin-bottom:8px}
.spinner-wrap{display:flex;align-items:center;justify-content:center;padding:40px;gap:12px;color:var(--text2);font-size:13px}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;font-family:'IBM Plex Mono',monospace}
.msg-bar{
  position:fixed;bottom:20px;right:20px;z-index:999;
  background:var(--bg3);border:1px solid var(--border2);border-radius:8px;
  padding:10px 16px;font-size:13px;display:flex;align-items:center;gap:8px;
  box-shadow:0 8px 32px rgba(0,0,0,.5);transform:translateY(80px);opacity:0;
  transition:all .25s;max-width:320px;
}
.msg-bar.show{transform:none;opacity:1}
.msg-bar.ok{border-color:var(--ok);color:var(--ok)}
.msg-bar.err{border-color:var(--err);color:var(--err)}
.msg-bar.warn{border-color:var(--warn);color:var(--warn)}
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:24px;width:480px;max-width:100%;box-shadow:0 24px 80px rgba(0,0,0,.6);max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
/* COLORS */
.c-ok{color:var(--ok)}.c-err{color:var(--err)}.c-warn{color:var(--warn)}.c-accent{color:var(--accent)}
@media(max-width:700px){
  .layout{grid-template-columns:1fr}
  .sidebar{display:none}
  .week-grid{grid-template-columns:140px repeat(7,1fr)}
}
</style>
</head>
<body>

<!-- ─── LOGIN SCREEN ─────────────────────────────── -->
<div id="screen-login" class="screen active">
  <div class="login-card">
    <div class="login-logo">BREAK//SCHED</div>
    <div class="login-sub">Shift Break Manager v2.0</div>

    <div id="login-mode-tabs" style="display:flex;gap:6px;margin-bottom:20px">
  <button class="btn" id="tab-login-btn" onclick="setLoginMode('login')" style="flex:1">Sign in</button>
  <button class="btn" id="tab-import-btn" onclick="setLoginMode('import')" style="flex:1.2">Sheets Link</button>
  <button class="btn btn-accent" id="tab-paste-btn" onclick="setLoginMode('paste')" style="flex:1.2">Direct Paste</button>
</div>

    <div id="login-form">
      <label class="login-label">Username</label>
      <input class="login-input" id="li-user" placeholder="e.g. tho.nh" list="user-list">
      <datalist id="user-list"></datalist>
      <label class="login-label">Password</label>
      <input class="login-input" id="li-pass" type="password" placeholder="••••••">
      <label class="login-label" style="margin-top:12px">Your current shift</label>
      <select class="login-select" id="li-shift">
        <option value="">— Select shift —</option>
        <option value="A">Shift A — 3:00 PM → 12:00 AM</option>
        <option value="B">Shift B — 7:00 PM → 4:00 AM</option>
        <option value="C">Shift C — 9:00 PM → 6:00 AM</option>
        <option value="D">Shift D — 12:00 AM → 9:00 AM</option>
        <option value="E">Shift E — 6:00 AM → 3:00 PM</option>
      </select>
      <div class="login-actions">
        <button class="btn btn-accent" onclick="doLogin()" style="width:100%">Sign in →</button>
        <div class="login-divider">or</div>
        <button class="btn" onclick="demoLogin('leader')" style="width:100%">Demo as Leader (AT1)</button>
        <button class="btn" onclick="demoLogin('agent')" style="width:100%">Demo as Agent</button>
      </div>
    </div>

   <div id="import-form" style="display:none">
  <label class="login-label">Google Sheet ID</label>
  <div class="import-row">
    <input class="login-input" id="sheet-id" placeholder="19YqrS2ls7..." value="19YqrS2ls7V74bJMQNjWavXTYEeRiMZDptbA_vKK2aPs">
    <button class="btn btn-accent" onclick="importSheet()">Import</button>
  </div>
</div>

<div id="paste-form" style="display:none">
  <label class="login-label">Paste from Google Sheets</label>
  <textarea id="paste-area" class="login-input" style="min-height:120px; font-family:monospace; font-size:10px; margin-bottom:12px;" placeholder="Copy cells in Sheets (including headers) and paste here..."></textarea>
  <button class="btn btn-accent" onclick="importFromPaste()" style="width:100%">Parse Paste Data →</button>
</div>

<div id="import-status" style="margin-top:12px; font-size:12px; min-height:18px"></div>
<div id="import-preview" style="display:none; margin-top:16px">
  <div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:8px; font-family:'IBM Plex Mono',monospace">
    Preview (<span id="preview-count">0</span> staff found)
  </div>
  <div id="preview-list" style="max-height:200px; overflow-y:auto; border:1px solid var(--border); border-radius:6px"></div>

function isLeader(u){ return u && (ROLES[u.role]?.level||0) >= 2; }
function getRoleInfo(r){ return ROLES[r] || {level:0,tag:'role-agent',label:r||'—'}; }

function setLoginMode(m) {
  // Elements to toggle
  const forms = {
    'login-form': m === 'login',
    'import-form': m === 'import',
    'paste-form': m === 'paste'
  };

  const buttons = {
    'tab-login-btn': m === 'login',
    'tab-import-btn': m === 'import',
    'tab-paste-btn': m === 'paste'
  };

  // Safe toggle for forms
  Object.keys(forms).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = forms[id] ? 'block' : 'none';
  });

  // Safe toggle for button highlights
  Object.keys(buttons).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.className = 'btn' + (buttons[id] ? ' btn-accent' : '');
  });
}
  
function importFromPaste() {
  const rawData = document.getElementById('paste-area').value.trim();
  const status = document.getElementById('paste-status');
  if (!rawData) { status.textContent = 'Paste something first!'; return; }
  
  // Convert tab-separated paste data into CSV format for the existing parser
  // We replace tabs with commas, but only if they aren't inside quotes
  const simulatedCSV = rawData.split('\n').map(line => {
    return line.split('\t').map(cell => `"${cell.replace(/"/g, '""')}"`).join(',');
  }).join('\n');
  
  // Reuse your existing parser!
  parseSheetCSV(simulatedCSV);
  
  // Move the preview to the visible area
  document.getElementById('import-preview').style.display = 'block';
  status.innerHTML = `<span style="color:var(--ok)">✓ Paste parsed! Preview below.</span>`;
}
function doLogin(){
  const u = document.getElementById('li-user').value.trim();
  const p = document.getElementById('li-pass').value.trim();
  const s = document.getElementById('li-shift').value;
  const err = document.getElementById('login-err');
  if(!u||!p){ err.textContent='Enter username and password.'; return; }
  if(!s){ err.textContent='Please select your current shift.'; return; }
  const user = state.users.find(x=>x.username===u && x.password===p);
  if(!user){ err.textContent='Invalid credentials.'; return; }
  currentUser = user;
  currentShift = s;
  err.textContent='';
  enterApp();
}

  if(type==='leader'){

function enterApp(){
  document.getElementById('screen-login').classList.remove('active');
  document.getElementById('screen-app').classList.add('active');

  const ri = getRoleInfo(currentUser.role);

// ═══════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════
function todayKey(){
  const d=new Date();
  return WEEK_DAYS[d.getDay()===0?6:d.getDay()-1];
}
function getShiftMates(shift, day){
  return state.users.filter(u=>{
    const s = u.schedule[day||todayKey()];
    return s===shift;
  });
}
function getBreakKey(userId, day){ return `${userId}_${day||todayKey()}`; }
function getAssigned(userId, day){ return state.breaks[getBreakKey(userId,day)]; }
function assign(userId, day, slot, note){
  state.breaks[getBreakKey(userId,day)] = {slot, note:note||'', by:currentUser.id, at:Date.now()};
  save();
}
function updateBadge(){
  const pending = state.requests.filter(r=>r.status==='pending').length;
  const badge = document.getElementById('req-badge');
  badge.style.display = pending>0?'':'none';
  badge.textContent = pending;
}

function renderDashboard(){

  const assigned = mates.filter(u=>getAssigned(u.id, today));
  const pending = state.requests.filter(r=>r.status==='pending');
  const mine = getAssigned(currentUser.id, today);

  return `
  <div class="page-header">
    <div>
      <div class="page-title">Dashboard</div>
      <div class="page-sub">Today: ${today} · Shift ${currentShift} — ${SHIFTS[currentShift].display}</div>

    <div class="stat"><div class="stat-label">Breaks assigned</div><div class="stat-num c-ok">${assigned.length}</div></div>
    ${isLeader(currentUser)?`<div class="stat"><div class="stat-label">Pending requests</div><div class="stat-num c-warn">${pending.length}</div></div>`:''}
  </div>

  <div class="card">
    <div class="card-title">Your break today</div>
    ${mine
      ? `<div style="display:flex;align-items:center;gap:12px">
          <span class="break-slot mine">${mine.slot}</span>
          <span style="font-size:12px;color:var(--text2)">Assigned by ${state.users.find(x=>x.id===mine.by)?.name||'system'}</span>
          ${!isLeader(currentUser)?`<button class="btn btn-sm btn-warn" onclick="openRequestModal('${mine.slot}')">Request change</button>`:''}
        </div>`
      : `<div style="font-size:13px;color:var(--text2)">No break assigned yet for today. 
          ${isLeader(currentUser)?'Go to <b>Arrange Breaks</b> to set schedules.':'Check back later or contact your leader.'}</div>`
    }
  </div>

  <div class="card">
    <div class="card-title">Shift ${currentShift} — Today's breaks</div>
    ${mates.length===0
      ? `<div class="empty"><div class="empty-ico">👥</div>No staff on shift ${currentShift} today.</div>`
      : `<div class="break-board">${mates.map(u=>{
          const br = getAssigned(u.id, today);
          const isMe = u.id===currentUser.id;
          return `<div class="break-row${br?'':' pending'}">
            <div>
              <div class="emp-name">${isMe?'<b>'+u.name+' (you)</b>':u.name}</div>
              <div class="emp-meta">${u.team} · ${u.role}</div>
            </div>
            <div>
              ${br
                ? `<span class="break-slot ${isMe?'mine':'assigned'}">${br.slot}</span>`
                : `<span style="font-size:11px;color:var(--text3);font-family:'IBM Plex Mono',monospace">Not assigned</span>`}
            </div>
            <div></div>
          </div>`;
        }).join('')}</div>`
    }
  </div>
  `;
}

function renderSchedule(){
  const shiftUsers = state.users.filter(u=>WEEK_DAYS.some(d=>u.schedule[d]===currentShift));

  const headers = `<div class="wg-header">Name</div>`+WEEK_DAYS.map(d=>{
    const today = todayKey();
    return `<div class="wg-header${d===today?' c-accent':''}">${d}</div>`;
  }).join('');

  const rows = shiftUsers.map((u,ri)=>{
    const cells = WEEK_DAYS.map(d=>{
      const onShift = u.schedule[d]===currentShift;
      const br = getAssigned(u.id, d);
      const isMe = u.id===currentUser.id;
      const dayOff = u.schedule[d]==='0';
      if(dayOff) return `<div class="wg-cell"><span class="sh sh-0">—</span></div>`;
      if(!onShift) return `<div class="wg-cell"><span class="sh sh-${u.schedule[d]||'0'}">${u.schedule[d]||'?'}</span></div>`;
      return `<div class="wg-cell">
        ${br
          ? `<span class="break-slot ${isMe?'mine':'assigned'}" style="font-size:10px;padding:3px 6px" title="${br.slot}">${br.slot.split('–')[0]}</span>`
          : `<span style="font-size:10px;color:var(--text3);font-family:'IBM Plex Mono',monospace">—</span>`}
      </div>`;
    }).join('');
    return `<div class="wg-row" style="display:contents">
      <div class="wg-name"><div class="n">${u.name}</div><div class="m">${u.team}</div></div>
      ${cells}
    </div>`;
  }).join('');

  return `
  <div class="page-header">
    <div>
      <div class="page-title">Break Schedule — Week View</div>
      <div class="page-sub">Shift <b style="color:${SHIFTS[currentShift].color}">${currentShift}</b> · ${SHIFTS[currentShift].display}</div>
    </div>
  </div>
  ${shiftUsers.length===0
    ? `<div class="empty"><div class="empty-ico">📅</div>No staff found on Shift ${currentShift}.</div>`
    : `<div class="tbl-wrap" style="overflow:auto">
        <div class="week-grid" style="min-width:700px">${headers}${rows}</div>
      </div>`
  }

    💡 Break slots show start time only. ${!isLeader(currentUser)?'Contact your leader to update your break time.':'Go to Arrange Breaks to edit.'}
  </div>
  `;
}

// ═══════════════════════════════════════════════
//  RENDER: REQUESTS
// ═══════════════════════════════════════════════
function renderRequests(){
  const myReqs = isLeader(currentUser)
    ? state.requests
    : state.requests.filter(r=>r.userId===currentUser.id);

  const pending = myReqs.filter(r=>r.status==='pending');
  const rest    = myReqs.filter(r=>r.status!=='pending');

  const card = (r,idx)=>{
    const emp = state.users.find(u=>u.id===r.userId);
    const isOwn = r.userId===currentUser.id;
    return `<div class="req-card ${r.status}">
      <div class="req-header">
        <div>
          <div class="req-title">${emp?.name||'Unknown'}</div>
          <div class="req-meta">${emp?.team||'—'} · ${r.day} · submitted ${timeSince(r.at)}</div>
        </div>
        <span class="req-status ${r.status}">${r.status.toUpperCase()}</span>
      </div>
      <div class="req-body">
        <span style="color:var(--text3)">Current:</span> <b>${r.current}</b> &nbsp;→&nbsp;
        <span style="color:var(--text3)">Requested:</span> <b style="color:var(--warn)">${r.requested}</b><br>
        <span style="color:var(--text3)">Reason:</span> ${r.reason||'No reason given'}
        ${r.status!=='pending'&&r.respNote?`<br><span style="color:var(--text3)">Response:</span> ${r.respNote}`:''}
      </div>
      ${r.status==='pending' && isLeader(currentUser) && !isOwn ? `
        <div class="req-actions">
          <button class="btn btn-sm btn-ok" onclick="resolveRequest(${idx},'approved')">✓ Approve</button>
          <button class="btn btn-sm btn-err" onclick="resolveRequest(${idx},'rejected')">✗ Reject</button>
        </div>` : ''}
    </div>`;
  };

  return `
  <div class="page-header">
    <div>
      <div class="page-title">${isLeader(currentUser)?'Approval Queue':'My Requests'}</div>
      <div class="page-sub">${isLeader(currentUser)?`${pending.length} pending approval`:'Track your break change requests'}</div>
    </div>
    ${!isLeader(currentUser)?`<button class="btn btn-accent" onclick="openRequestModal()">+ New request</button>`:''}
  </div>

  ${pending.length>0?`
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--warn);margin-bottom:10px;font-family:'IBM Plex Mono',monospace">⏳ Pending (${pending.length})</div>
    ${pending.map((r,i)=>card(r,state.requests.indexOf(r))).join('')}`:''}

  ${rest.length>0?`
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin:16px 0 10px;font-family:'IBM Plex Mono',monospace">History</div>
    ${rest.slice(0,20).map((r,i)=>card(r,state.requests.indexOf(r))).join('')}
  `:''}

  ${myReqs.length===0?`<div class="empty"><div class="empty-ico">✅</div>No requests yet.</div>`:''}
  `;
}

// ═══════════════════════════════════════════════
//  ARRANGE HELPERS
// ═══════════════════════════════════════════════
function switchArrangeDay(day){
  document.querySelectorAll('#arrange-tabs .tab').forEach(t=>t.classList.toggle('on',t.dataset.day===day));
  const mates = getShiftMates(currentShift, day);
  const slots = BREAK_SLOTS[currentShift]||[];
  const content = document.getElementById('arrange-day-content');
  if(!mates.length){content.innerHTML=`<div class="empty"><div class="empty-ico">👥</div>No staff on ${day}.</div>`;return;}
  content.innerHTML=`<div class="break-board">${mates.map(u=>{
    const br=getAssigned(u.id,day);
    return `<div class="break-row">
      <div><div class="emp-name">${u.name}</div><div class="emp-meta">${u.team}·${u.role}</div></div>
      <div class="break-slots">
        ${slots.map(s=>`<span class="break-slot${br?.slot===s?' assigned':''}" onclick="quickAssign(${u.id},'${day}','${s}')">${s}</span>`).join('')}
      </div>
      <div><button class="btn btn-sm btn-warn" onclick="openAssignModal(${u.id},'${day}')">Assign</button></div>
    </div>`;
  }).join('')}</div>`;
}

function quickAssign(uid, day, slot){
  if(!isLeader(currentUser)){toast('Only leaders can assign breaks.','err');return;}
  assign(uid, day, slot,'');
  toast(`Break assigned: ${slot}`);
  switchArrangeDay(day);
  updateBadge();
}

function autofillDay(){
  const day=todayKey();
  const mates=getShiftMates(currentShift,day);
  const slots=BREAK_SLOTS[currentShift]||[];
  mates.forEach((u,i)=>assign(u.id,day,slots[i%slots.length],'auto'));
  toast(`Auto-filled ${mates.length} breaks for today`,'ok');
  nav('arrange');
}

function autofillWeek(){
  let count=0;
  WEEK_DAYS.forEach(day=>{
    const mates=getShiftMates(currentShift,day);
    const slots=BREAK_SLOTS[currentShift]||[];
    mates.forEach((u,i)=>{assign(u.id,day,slots[i%slots.length],'auto');count++;});
  });
  toast(`Auto-filled ${count} breaks across the week`,'ok');
  nav('arrange');
}

// ═══════════════════════════════════════════════
//  ASSIGN MODAL
// ═══════════════════════════════════════════════
function openAssignModal(uid,day){
  assigningEmp={uid,day};
  const u=state.users.find(x=>x.id===uid);
  document.getElementById('assign-title').textContent=`Assign break — ${u?.name||'?'} (${day})`;
  const slots=BREAK_SLOTS[currentShift]||[];
  const cur=getAssigned(uid,day);
  document.getElementById('assign-slot').innerHTML=slots.map(s=>`<option value="${s}"${cur?.slot===s?' selected':''}>${s}</option>`).join('');
  document.getElementById('assign-note').value='';
  document.getElementById('modal-assign').classList.add('show');
}
function confirmAssign(){
  if(!assigningEmp)return;
  const slot=document.getElementById('assign-slot').value;
  const note=document.getElementById('assign-note').value;
  assign(assigningEmp.uid,assigningEmp.day,slot,note);
  closeModal('modal-assign');
  toast('Break assigned!','ok');
  nav(currentPage);
}

// ═══════════════════════════════════════════════
//  REQUEST MODAL
// ═══════════════════════════════════════════════
function openRequestModal(currentSlot){
  const today=todayKey();
  const mine=getAssigned(currentUser.id,today);
  const cur=currentSlot||mine?.slot||'Not assigned';
  document.getElementById('req-cur').value=cur;
  const slots=BREAK_SLOTS[currentShift]||[];
  document.getElementById('req-new').innerHTML=`<option value="">— pick a time —</option>`+
    slots.filter(s=>s!==cur).map(s=>`<option value="${s}">${s}</option>`).join('');
  document.getElementById('req-reason').value='';
  document.getElementById('modal-request').classList.add('show');
}
function submitRequest(){
  const requested=document.getElementById('req-new').value;
  const reason=document.getElementById('req-reason').value.trim();
  if(!requested){toast('Pick a slot first.','err');return;}
  state.requests.unshift({
    id:Date.now(),
    userId:currentUser.id,
    day:todayKey(),
    current:document.getElementById('req-cur').value,
    requested,reason,
    status:'pending',
    at:Date.now(),
    respNote:'',
  });
  save();
  closeModal('modal-request');
  toast('Request submitted!','warn');
  updateBadge();
  nav('requests');
}
function resolveRequest(idx, status){
  state.requests[idx].status=status;
  state.requests[idx].resolvedBy=currentUser.id;
  state.requests[idx].resolvedAt=Date.now();
  if(status==='approved'){
    const r=state.requests[idx];
    assign(r.userId,r.day,r.requested,'approved by '+currentUser.name);
  }
  save();
  toast(status==='approved'?'Request approved ✓':'Request rejected','ok');
  updateBadge();
  nav('requests');
}

function closeModal(id){ document.getElementById(id).classList.remove('show'); }

// ═══════════════════════════════════════════════
//  IMPORT FROM GOOGLE SHEETS
// ═══════════════════════════════════════════════
let importedUsers = [];
function importSheet(){
  const id=document.getElementById('sheet-id').value.trim();
  if(!id){document.getElementById('import-status').textContent='Enter a sheet ID.';return;}
  const status=document.getElementById('import-status');
  status.innerHTML='<span style="color:var(--text2)"><span class="spin" style="display:inline-block;width:14px;height:14px;border-width:2px;vertical-align:middle;margin-right:6px"></span>Fetching sheet...</span>';
  document.getElementById('import-preview').style.display='none';

  // Use Google Sheets CSV export (works if sheet is publicly readable)
  const url=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=Schedule%20April_26`;
  fetch(url)
    .then(r=>{
      if(!r.ok) throw new Error('Sheet not accessible (make sure it is shared publicly).');
      return r.text();
    })
    .then(csv=>parseSheetCSV(csv))
    .catch(err=>{
      status.innerHTML=`<span style="color:var(--err)">⚠ ${err.message}</span>`;
    });
}

function parseSheetCSV(csv) {
  const status = document.getElementById('import-status');
  if (!status) {
    console.error("Critical Error: 'import-status' element is missing from HTML.");
    return;
  }

  try {
    const lines = csv.split('\n').map(l => parseCSVLine(l));
    
    // Find header row and map days
    let headerIdx = -1;
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].some(c => c.trim() === 'Mon' || c.trim() === 'NAME')) { headerIdx = i; break; }
    }
    
    const dateRow = lines.find(l => l.some(c => c.trim() === 'Mon'));
    const dayColMap = {};
    if (dateRow) {
      dateRow.forEach((c, i) => {
        const t = c.trim();
        if (WEEK_DAYS.includes(t)) dayColMap[t] = i;
      });
    }

    importedUsers = [];
    for (let i = 0; i < lines.length; i++) {
      const row = lines[i];
      const no = row[0]?.trim();
      const team = row[1]?.trim();
      const name = row[2]?.trim();
      const role = row[3]?.trim();
      
      if (!no || isNaN(parseInt(no)) || !name || name.length < 2) continue;
      
      const schedule = {};
      WEEK_DAYS.forEach(d => {
        const col = dayColMap[d];
        schedule[d] = (col !== undefined) ? (row[col]?.trim() || '0') : '0';
      });

      importedUsers.push({
        id: Date.now() + importedUsers.length,
        username: makeUsername(name),
        name, team, role,
        password: '1234',
        schedule,
      });
    }

    if (importedUsers.length === 0) {
      status.innerHTML = `<span style="color:var(--err)">Could not parse any staff rows. Check your selection.</span>`;
      return;
    }

    // Show results
    status.innerHTML = `<span style="color:var(--ok)">✓ Parsed successfully</span>`;
    document.getElementById('preview-count').textContent = importedUsers.length;
    document.getElementById('import-preview').style.display = 'block';
    document.getElementById('preview-list').innerHTML = importedUsers.slice(0, 30).map(u => `
      <div style="display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--border)">
        <span style="font-family:monospace;font-size:10px;color:var(--text3);width:36px">${u.team}</span>
        <span style="flex:1;font-size:12px;font-weight:500">${u.name}</span>
        <span style="font-size:11px;color:var(--text2)">${u.role}</span>
      </div>
    `).join('');

  } catch (e) {
    status.innerHTML = `<span style="color:var(--err)">Parse error: ${e.message}</span>`;
  }
}

function confirmImport(){
  // Add leaders for each team if not present
  const teams=[...new Set(importedUsers.map(u=>u.team))];
  const leaderUsers=teams.map((t,i)=>({
    id:900+i,
    username:`leader.${t.toLowerCase()}`,
    name:`Leader ${t}`,
    team:t,role:'Agent Leader',password:'leader123',
    schedule:{Mon:'E',Tue:'E',Wed:'E',Thu:'E',Fri:'E',Sat:'0',Sun:'0'},
  }));
  state.users=[...importedUsers,...leaderUsers];
  state.imported=true;
  state.breaks={};
  state.requests=[];
  save();
  buildDatalist();
  document.getElementById('import-status').innerHTML=`<span style="color:var(--ok)">✓ ${importedUsers.length} staff imported! Leaders created.</span>`;
  document.getElementById('import-preview').style.display='none';
  setTimeout(()=>setLoginMode('login'),1500);
}

function makeUsername(name){
  const parts=name.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/đ/g,'d').split(' ').filter(Boolean);
  return (parts[parts.length-1]||'user')+'.'+(parts[0]||'x');
}

function parseCSVLine(line){
  const result=[];let cur='';let inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
    else if(c===','&&!inQ){result.push(cur);cur='';}
    else cur+=c;
  }
  result.push(cur);
  return result;
}

function openImportPanel(){
  document.getElementById('staff-import-panel').innerHTML=`
    <div class="card" style="margin-top:16px">
      <div class="card-title">Re-import from Google Sheets</div>
      <div class="fg"><label>Sheet ID</label>
        <div style="display:flex;gap:8px"><input id="staff-sheet-id" class="login-input" value="19YqrS2ls7V74bJMQNjWavXTYEeRiMZDptbA_vKK2aPs" style="flex:1">
        <button class="btn btn-accent" onclick="reimportStaff()">Import</button></div>
      </div>
      <div id="reimport-status" style="font-size:12px;min-height:18px;margin-top:6px"></div>
    </div>`;
}
function reimportStaff(){
  const id=document.getElementById('staff-sheet-id').value.trim();
  const url=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=Schedule%20April_26`;

    .then(csv=>{parseSheetCSV(csv);confirmImport();document.getElementById('reimport-status').innerHTML='<span style="color:var(--ok)">✓ Reimported!</span>';nav('staff');})
    .catch(e=>document.getElementById('reimport-status').innerHTML=`<span style="color:var(--err)">${e.message}</span>`);
}

// ═══════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════
function timeSince(ts){
  const diff=Date.now()-ts;
  if(diff<60000) return 'just now';
  if(diff<3600000) return Math.floor(diff/60000)+'m ago';
  if(diff<86400000) return Math.floor(diff/3600000)+'h ago';
  return Math.floor(diff/86400000)+'d ago';
}

let toastTimer;
function toast(msg,type='ok'){
  const el=document.getElementById('toast');
  const ico={ok:'✓',err:'✕',warn:'⚡'}[type]||'';
  el.innerHTML=`<span>${ico}</span> ${msg}`;
  el.className=`msg-bar show ${type}`;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),3000);
}

// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(el=>{
  el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('show');});
});
// Enter key on login
document.getElementById('li-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
